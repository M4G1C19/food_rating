{% extends "base.html" %}
{% block content %}
<div class="profile-container">
    <img src="{{ avatar }}" alt="avatar" class="profile-avatar">
    <h2>Профиль пользователя</h2>
    <div class="profile-info">
        <p><b>Логин:</b> {{ user }}</p>
        <p><b>Роль:</b> {{ role }}</p>
        <p><b>Статус:</b> Активен</p>
    </div>
</div>
{% endblock %}
